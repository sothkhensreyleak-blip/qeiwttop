# ===== Qeiwt Top =====
# ចំនួនវិនាទីរវាងការ update ម្តង
refresh-seconds: 60
# ចំនួនលេខរៀង (1 ដល់ size)
size: 10
# មិនបង្ហាញអ្នកដែលតម្លៃ 0 ឬតិចជាងនេះ (ដាក់ false ដើម្បីបង្ហាញទាំងអស់)
hide-zero: true

messages:
  header: "&6&l===== &eQeiwt Top &f%title% &6&l====="
  line: "&e#%rank% &f%player% &7- &a%value%"
  empty: "&7(មិនទាន់មានទិន្នន័យ)"
  unknown: "&cមិនមាន top ឈ្មោះនេះទេ។ ប្រើ: &f/top list"
  list: "&eTop ដែលមាន: &f%tops%"
  reloaded: "&aបាន reload config រួចហើយ"
  no-permission: "&cអ្នកគ្មានសិទ្ធិ"

# ===== បង្កើត top ខ្លួនឯង =====
# ឈ្មោះ key (kills, deaths, money...) គឺជាអ្វីដែលវាយក្រោយ /top
# type មាន 3 យ៉ាង:
#   STATISTIC   = ប្រើ statistic របស់ Minecraft (ដាក់ក្នុង statistic:)
#   VAULT       = លុយពី Vault / Economy plugin
#   PLACEHOLDER = ប្រើ PlaceholderAPI placeholder ណាមួយ (ដាក់ក្នុង placeholder:)
# ជម្រើសផ្សេងៗ:
#   title   = ឈ្មោះបង្ហាញ
#   divide  = ចែកតម្លៃ (ឧ. playtime ticks / 72000 = ម៉ោង)
#   format  = ទម្រង់លេខ (Java DecimalFormat)
#   prefix / suffix = អក្សរមុខ/ក្រោយតម្លៃ
tops:
  kills:
    title: "Kills"
    type: STATISTIC
    statistic: PLAYER_KILLS
    format: "#,##0"

  deaths:
    title: "Deaths"
    type: STATISTIC
    statistic: DEATHS
    format: "#,##0"

  money:
    title: "Money"
    type: VAULT
    prefix: "$"
    format: "#,##0.00"

  playtime:
    title: "Playtime"
    type: STATISTIC
    statistic: PLAY_ONE_MINUTE
    divide: 72000
    suffix: " ម៉ោង"
    format: "#,##0.0"

  mobkills:
    title: "Mob Kills"
    type: STATISTIC
    statistic: MOB_KILLS
    format: "#,##0"

  # ឧទាហរណ៍ top ពី PlaceholderAPI (ត្រូវការ PlaceholderAPI + expansion)
  # level:
  #   title: "Level"
  #   type: PLACEHOLDER
  #   placeholder: "%player_level%"
  #   format: "#,##0"
