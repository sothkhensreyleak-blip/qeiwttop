api-version: "26.2"
softdepend: [Vault, PlaceholderAPI]
commands:
  top:
    description: មើល Qeiwt Top leaderboard
    usage: /top <name|list|reload>
    aliases: [qtop, qeiwttop, lb, leaderboard]
permissions:
